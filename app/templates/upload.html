{% extends "base.html" %}
{% block body %}
<h2>上传 Excel 数据</h2>
<p class="text-muted">三类表均可单独上传或一次性上传。未上传的会回退到 <code>data/</code> 下的示例文件。</p>

<form method="post" enctype="multipart/form-data" class="card p-4">
  <div class="mb-3">
    <label class="form-label">员工档案（必含字段：emp_id, name, department, position, hire_date, gender）</label>
    <input type="file" name="employees" accept=".xlsx" class="form-control">
  </div>
  <div class="mb-3">
    <label class="form-label">考勤记录（必含字段：emp_id, date, check_in, check_out, work_hours, status）</label>
    <input type="file" name="attendance" accept=".xlsx" class="form-control">
  </div>
  <div class="mb-3">
    <label class="form-label">绩效数据（必含字段：emp_id, month, score, rating）</label>
    <input type="file" name="performance" accept=".xlsx" class="form-control">
  </div>
  <button class="btn btn-primary" type="submit">提交上传</button>
</form>
{% endblock %}
