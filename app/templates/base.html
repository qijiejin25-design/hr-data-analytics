<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}人事数据分析平台{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 70px; background: #f7f9fc; }
    .chart-card img { max-width: 100%; height: auto; }
    .navbar-brand { font-weight: 600; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('main.index') }}">HR 数据分析平台</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('main.upload') }}">上传数据</a>
      <a class="nav-link" href="{{ url_for('main.dashboard') }}">分析仪表盘</a>
      <a class="nav-link" href="{{ url_for('main.filter_view') }}">筛选查询</a>
      <a class="nav-link" href="{{ url_for('main.export_report') }}">导出月报</a>
    </div>
  </div>
</nav>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="alert alert-{{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
